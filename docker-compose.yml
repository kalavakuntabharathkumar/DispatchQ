services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dispatchq
      POSTGRES_USER: dispatchq
      POSTGRES_PASSWORD: dispatchq_dev
    ports: ["5432:5432"]
    volumes: [dispatchq_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchq -d dispatchq"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [dispatchq_redis:/data]
volumes:
  dispatchq_pg:
  dispatchq_redis:
